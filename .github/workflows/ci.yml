name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build, test and lint (foss and play)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null

      - name: Build foss
        run: ./gradlew :app:assembleFossDebug :app:assembleFossRelease

      - name: Placeholder google-services.json
        run: cp .github/ci/google-services.placeholder.json app/google-services.json

      - name: Build play
        run: ./gradlew :app:assemblePlayDebug :app:assemblePlayRelease

      - name: Unit tests
        run: ./gradlew test

      - name: Lint
        run: ./gradlew :app:lintFossDebug :app:lintPlayDebug

      - name: No proprietary dependencies in foss
        run: |
          ./gradlew -q :app:dependencies --configuration fossReleaseRuntimeClasspath > foss-dependencies.txt
          if grep -E 'com\.google\.firebase|com\.google\.android\.gms|com\.google\.android\.datatransport' foss-dependencies.txt; then
            echo "::error::The foss flavor depends on Firebase or Google Play services"
            exit 1
          fi

      - name: Upload foss debug APK
        uses: actions/upload-artifact@v7
        with:
          name: quasporium-foss-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          retention-days: 14

      - name: Upload test and lint reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 14
