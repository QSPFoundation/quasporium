name: Baseline profile

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate the baseline profile (managed emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Install NDK and CMake
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.3.13750724" "cmake;3.22.1" > /dev/null

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Generate
        run: >-
          ./gradlew :app:generateFossReleaseBaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect

      - name: Upload the profile
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile
          path: app/src/fossRelease/generated/baselineProfiles/
          retention-days: 30

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: baseline-profile-reports
          path: |
            baselineprofile/build/reports/
            baselineprofile/build/outputs/
          retention-days: 14

      - name: Open a pull request with the profile
        uses: peter-evans/create-pull-request@v8
        with:
          branch: baseline-profile/update
          delete-branch: true
          add-paths: app/src/fossRelease/generated/baselineProfiles/
          commit-message: Update the baseline profile
          title: Update the baseline profile
          body: |
            Generated by the *Baseline profile* workflow on `${{ github.sha }}`
            (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

            CI does not start for pull requests opened with `GITHUB_TOKEN`:
            close and reopen this pull request, or run CI manually, before merging.
