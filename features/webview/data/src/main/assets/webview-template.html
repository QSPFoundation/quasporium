<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <style type="text/css">
        QSPCUSTOMFONTFACE

        :root {
            --qsp-bg-color: QSPBACKCOLOR;
            --qsp-text-color: QSPTEXTCOLOR;
            --qsp-link-color: QSPLINKCOLOR;
            --qsp-font-size: QSPFONTSIZE;
            --qsp-font-style: QSPFONTSTYLE;
        }

        body {
          margin: 0;
          padding: 0.5em;
          color: var(--qsp-text-color);
          background-color: var(--qsp-bg-color);
          font-size: var(--qsp-font-size);
          font-family: var(--qsp-font-style);
          overflow-wrap: break-word;
          word-wrap: break-word;
        }

        a { color: var(--qsp-link-color); }
        a:link { color: var(--qsp-link-color); }

        img {
          max-width: 100%;
          height: auto;
          content-visibility: auto;
        }

        video, iframe, table { max-width: 100%; }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
           background: rgba(128, 128, 128, 0.4);
           border-radius: 3px;
        }
    </style>
</head>
<body>REPLACETEXT</body>
</html>
