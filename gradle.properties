#Gradle
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1024m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding\=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true

#Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx4g

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

#Android check
android.usesSdkInManifest.disallowed=true
android.sdk.defaultTargetSdkToCompileSdkIfUnset=true

#Android res
android.defaults.buildfeatures.resvalues=false
android.enableAppCompileTimeRClass=true
android.uniquePackageNames=true

#Android R8
android.r8.strictFullModeForKeepRules=true
android.r8.optimizedResourceShrinking=true

#Android dependency
android.dependency.useConstraints=false
android.builtInKotlin=true

#Android NEW DSL
android.newDsl=true
# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
